name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job only needs to read the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Verify (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The V2 platform modules (the kernel reactor and the forge-* modules) are local
      # Maven projects, not published artifacts. The application pom depends on them, so
      # they must be installed into the runner's local repository before it can resolve.
      # Same ordering as backend/Dockerfile, which does this for the image build.
      - name: Install local platform modules
        working-directory: backend
        run: |
          for module in kernel forge-knowledge forge-fvcs forge-fkge forge-fxp; do
            mvn -B -ntp -f "$module/pom.xml" install -DskipTests
          done

      # ubuntu-latest ships Maven and Docker; Testcontainers (PostgreSQL) uses the
      # preinstalled Docker daemon. The repository has no Maven wrapper by design.
      - name: Build, test & verify
        run: mvn -B -ntp -f backend/pom.xml clean verify

      - name: Upload application JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: broks-forge-api-jar
          path: backend/target/broks-forge-api.jar
          if-no-files-found: error
          retention-days: 14

      # `mvn verify` runs the JaCoCo report goal (see backend/pom.xml). Publish it so
      # coverage is reviewable per build. Targets are documented in docs/AUTOMATED_TESTING.md.
      - name: Upload coverage report (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco
          if-no-files-found: warn
          retention-days: 14
